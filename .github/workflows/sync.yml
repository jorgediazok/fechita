# Dispara /api/cron/sync seguido para que los resultados aparezcan ni bien terminan los
# partidos. El endpoint decide solo si le pega a la API de partidos o no (ver
# web/src/app/api/cron/sync/route.ts) — la mayoría de estas corridas no hacen nada.
#
# GitHub Actions programadas: mínimo cada 5 min y "best effort" (se atrasan seguido bajo
# carga). Si querés timing más firme, un cron externo tipo cron-job.org es mejor — ver
# CLAUDE.md. GitHub además desactiva el schedule si el repo queda 60 días sin actividad.
#
# Necesita dos secrets en el repo (Settings → Secrets and variables → Actions):
#   SYNC_URL     → https://<tu-dominio>/api/cron/sync
#   CRON_SECRET  → el mismo valor que la env var CRON_SECRET del deploy
name: sync-partidos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-partidos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit sync endpoint
        run: |
          code=$(curl -sS -m 90 -o /tmp/out.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_URL }}")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          test "$code" = "200"
